<div class="results-container">
    @if (originalMusic && recommendedMusic) {
    <h2>Match encontrado 🎧</h2>

    <div class="match-container">
        <div class="music-card">
            <p class="label">Você buscou</p>

            <img [src]="originalMusic.cover" [alt]="originalMusic.title">

            <h3>{{ originalMusic.title }}</h3>
            <p>{{ originalMusic.artist }}</p>

            @if (originalMusic.preview) {
            <app-player [previewUrl]="originalMusic.preview"></app-player>
            }
        </div>

        <div class="music-card">
            <p class="label">Recomendamos</p>

            <img [src]="recommendedMusic.cover" [alt]="recommendedMusic.title">

            <h3>{{ recommendedMusic.title }}</h3>
            <p>{{ recommendedMusic.artist }}</p>

            @if (recommendedMusic.preview) {
            <app-player [previewUrl]="recommendedMusic.preview"></app-player>
            }
        </div>
    </div>
    }
</div>
