<div class="audio-player">
    <button class="play-btn" type="button" (click)="togglePlay()">
        {{ isPlaying ? '⏸' : '▶' }}
    </button>

    <input type="range" min="0" [max]="duration || 0" step="0.01" [value]="currentTime"
        [style.background]="getProgressBackground()" (input)="seek($event)">
    <span class="time">
        {{ formatTime(currentTime) }} / {{ formatTime(duration) }}
    </span>
</div>
