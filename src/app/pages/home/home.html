<app-header></app-header>

<section class="main">
  <h1>Descubra músicas que combinam com você</h1>
  <p class="subtitle">Encontre novas faixas que dão match com sua música favorita.</p>

  <app-search (onSearch)="handleSearch($event)" [loading]="loading">
  </app-search>

  @if (loading) {
  <p class="loading-text">Buscando músicas...</p>
  }

  @if (errorMessage) {
  <p class="error-text">{{ errorMessage }}</p>
  }

  <app-results [originalMusic]="originalMusic" [recommendedMusic]="recommendedMusic"
    (recommendAgain)="handleRecommendAgain()"></app-results>
</section>
